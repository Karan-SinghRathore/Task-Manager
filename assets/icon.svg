<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1f2b"/>
      <stop offset="100%" stop-color="#10131c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4da3ff"/>
      <stop offset="100%" stop-color="#2f6fe0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square base (Windows 11 style) -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#2a2f3d" stroke-width="2"/>

  <!-- Checklist lines -->
  <g stroke="#3a4257" stroke-width="10" stroke-linecap="round">
    <line x1="96" y1="92" x2="176" y2="92"/>
    <line x1="96" y1="130" x2="176" y2="130"/>
    <line x1="96" y1="168" x2="150" y2="168"/>
  </g>
  <g fill="#3a4257">
    <circle cx="72" cy="92" r="7"/>
    <circle cx="72" cy="130" r="7"/>
  </g>

  <!-- Checkmark badge (blue accent) -->
  <circle cx="80" cy="168" r="34" fill="url(#accent)"/>
  <path d="M64 168 L76 180 L98 154" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
